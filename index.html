<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }
        body {
            background-color: #081716;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 50px 50px;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }
        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            padding-top: 70px;
        }

        .header h1 {
            margin: 0;
            font-size: 70px;
            line-height: 1;
            font-weight: 800;
        }

        .game-count {
            margin-top: 25px;
            font-size: 17px;
            font-weight: 700;
        }


        /* =========================
           SEARCH
        ========================= */

        .controls {
            width: 800px;
            max-width: calc(100% - 40px);

            margin: 27px auto 58px;

            display: flex;
            gap: 10px;
        }

        .search {
            flex: 1;

            height: 53px;

            border: 0;
            outline: none;

            border-radius: 9px;

            background: #192e2d;

            color: white;

            padding: 0 20px;

            text-align: center;

            font-size: 16px;
        }

        .search::placeholder {
            color: #a9b6b5;
            font-style: italic;
        }

.category {
    width: 170px;
    height: 53px;
    border: 0;
    outline: none;
    border-radius: 6px; /* Changed from 20px to 6px */
    background: #192e2d;
    color: white;
    padding: 0 15px;
    font-size: 15px;
}



        /* =========================
           GAME GRID
        ========================= */

        .games {
            width: calc(100% - 250px);
            max-width: 1080px;

            margin-left: 100px;
            margin-right: 130px;

            display: grid;

            grid-template-columns: repeat(5, minmax(0, 1fr));

            gap: 0px;

            padding-bottom: 80px;
        }


        /* =========================
           GAME CARD
        ========================= */

        .game {
            display: block;

            color: white;
            text-decoration: none;

            min-width: 0;
        }

        .game-image {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;

            overflow: hidden;

            border-radius: 0px;

            background: #172827;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

       .game-image {
    position: relative;
}

/* Black overlay */
.game-image::after {
    content: "";
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.75);

    opacity: 0;

    transition: opacity 0.25s ease;

    z-index: 3;
}

/* Game title */
.game-title {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    color: white;

    font-size: 24px;
    font-weight: 800;

    text-align: center;
    white-space: nowrap;

    opacity: 0;

    transition: opacity 0.25s ease;

    z-index: 4;
}

/* Show overlay and title */
.game:hover .game-image::after,
.game:hover .game-title {
    opacity: 1;
}

        .game-image img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
            
            position: relative;
            z-index: 2;
        }


        /* =========================
           PRESET IMAGE (FALLBACK)
        ========================= */

        .placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #ebe3d8;

            color: #777;

            font-size: 70px;
            font-weight: bold;
            z-index: 1;
        }


        /* =========================
           GAME NAME
        ========================= */

        .game-name {
            margin-top: 10px;

            text-align: center;

            font-size: 16px;

            font-weight: 700;

            color: #ffffff;
            margin-bottom: 25px;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;

            top: 139px;
            right: 18px;

            width: 80px;

            padding: 18px 0;

            background: #142a29;

            border-radius: 10px;

            z-index: 9999;

            display: flex;

            flex-direction: column;

            align-items: center;
        }

       .side-button {
    width: 54px;
    height: 54px;
    margin: 3px auto;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    text-decoration: none;
    font-size: 24px;

    border-radius: 14px;
    transition: .2s ease;
}

.side-button:hover {
    background: rgba(0,255,157,.1);
    transform: translateY(-2px);
}

.side-button.active {
    background: var(--green);
    color: #00150d;
    box-shadow: 0 0 25px rgba(0,255,157,.25);
}



        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1200px) {

            .games {
                grid-template-columns: repeat(4, minmax(0, 1fr));

                width: calc(100% - 220px);

                margin-left: 40px;
                margin-right: 140px;
            }
        }

        @media (max-width: 850px) {

            .header h1 {
                font-size: 55px;
            }

            .games {
                grid-template-columns: repeat(3, minmax(0, 1fr));

                width: calc(100% - 40px);

                margin-left: 20px;
                margin-right: 20px;
            }

            .sidebar {
                position: fixed;

                top: auto;
                bottom: 15px;

                left: 50%;

                right: auto;

                transform: translateX(-50%);

                width: auto;

                padding: 8px 10px;

                flex-direction: row;
            }
        }

        @media (max-width: 600px) {

            .header {
                padding-top: 45px;
            }

            .header h1 {
                font-size: 45px;
            }

            .controls {
                flex-direction: column;
            }

            .category {
                width: 100%;
            }

            .games {
                grid-template-columns: repeat(2, minmax(0, 1fr));

                gap: 0px;
            }
        }
    </style>
</head>
